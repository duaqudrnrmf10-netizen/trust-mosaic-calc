  <style>

      margin: 6px 0;
      font-size: clamp(13px, 3.8vw, 16px);

      padding: 12px 12px 14px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    }

    #svc-est-m .trust-cta-m{
      width:100%;
      display:inline-flex; align-items:center; justify-content:center; gap:10px;
      margin-top:16px;
      padding:18px 16px;
      font-size: clamp(15px, 4.2vw, 18px);

    #svc-est-m .px6up {

      position:fixed;

      width:100vw; height:100vh;

      font-size:24px; font-weight:900; line-height:1; cursor:pointer;
      box-shadow:0 4px 14px rgba(0,0,0,.25);

  <div class="trust-m-inner">
    <h2>1. 서비스 상세 소개</h2>

    <div class="trust-panel">
      <p class="price-title">1) <span class="trust-strong">가격 책정방식</span></p>
      <p>기본요금은 5분 <span class="trust-strong">25,000원</span> / 15분 <span class="trust-strong">75,000원</span> / 30분 <span class="trust-strong">110,000원</span> / 60분 <span class="trust-strong">190,000원</span>이며,</p>

    <button type="button" class="trust-cta-m" id="openEstimatorM"

      <span class="px6up">예상 견적가 확인하기</span>
      <span class="cta-note">(견적서 출력 가능)</span>

  <!-- Modal -->
  <div class="trust-overlay" id="estModalM"
    onclick="if(event.target===this){this.style.setProperty('display','none','important');document.documentElement.style.overflow='';document.body.style.overflow='';}">

      <button type="button" class="trust-close" id="closeEstimatorM" aria-label="닫기"
